name: Build Kotlin Standalone TV APK
on:
  push:
    branches: ['main', 'master', 'fix/*']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build Debug APK
        run: |
          ./kotlin-tv/gradlew -p kotlin-tv :core:test :app:assembleDebug --console=plain
          mkdir -p outputs
          cp kotlin-tv/app/build/outputs/apk/debug/app-debug.apk outputs/hongguoTV-tv-fixed.apk
          ls -lh outputs/
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hongguoTV-apk
          path: outputs/hongguoTV-tv-fixed.apk
      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v0.8.1-fixed
          name: "红果 TV 修复搜索版 (v0.8.1-fixed)"
          body: "修复搜索功能，支持红果短剧及漫剧搜索并流畅播放。"
          files: outputs/hongguoTV-tv-fixed.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
